[tool.poetry]
name = "industrial-knowledge-backend"
version = "0.1.0"
description = "FastAPI Backend for the Industrial Knowledge Intelligence Platform"
authors = ["Industrial AI Platform Engineers"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.28.0"}
pydantic = "^2.6.4"
pydantic-settings = "^2.2.1"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.28"}
alembic = "^1.13.1"
psycopg = {extras = ["binary"], version = "^3.1.18"}
neo4j = "^5.18.0"
langchain = "^0.1.12"
langchain-community = "^0.0.28"
langchain-openai = "^0.1.1"
langgraph = "^0.0.26"
pdfplumber = "^0.11.0"
pypdf2 = "^3.0.1"
python-docx = "^1.1.0"
pandas = "^2.2.1"
pytesseract = "^0.3.10"
python-multipart = "^0.0.9"
structlog = "^24.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
pytest-asyncio = "^0.23.5"
black = "^24.2.0"
mypy = "^1.9.0"
ruff = "^0.3.3"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
