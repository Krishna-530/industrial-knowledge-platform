[tool.poetry]
name = "industrial-knowledge-backend"
version = "0.1.0"
description = "FastAPI Backend for the Industrial Knowledge Intelligence Platform"
authors = ["Industrial AI Platform Engineers"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.28.0"}
pydantic = "^2.6.4"
pydantic-settings = "^2.2.1"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.28"}
alembic = "^1.13.1"
psycopg = {extras = ["binary"], version = "^3.1.18"}
neo4j = "^5.18.0"
langchain = "^1.3.14"
langchain-community = "^0.4.2"
langchain-openai = "^1.3.5"
langgraph = "^1.2.9"
pdfplumber = "^0.11.0"
pypdf2 = "^3.0.1"
python-docx = "^1.1.0"
pandas = "^2.2.1"
pytesseract = "^0.3.10"
python-multipart = "^0.0.9"
structlog = "^24.1.0"
python-json-logger = "^4.1.0"
pyjwt = "^2.13.0"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
bcrypt = "^5.0.0"
asyncpg = "^0.31.0"
aiofiles = "^25.1.0"
python-pptx = "^1.0.2"
groq = "^1.5.0"
email-validator = "^2.3.0"
uuid6 = "^2025.0.1"
pybreaker = "^1.4.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
pytest-asyncio = "^0.23.5"
black = "^24.2.0"
mypy = "^1.9.0"
ruff = "^0.3.3"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
